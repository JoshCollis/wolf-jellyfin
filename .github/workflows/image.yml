name: Build and publish image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native regression dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ pkg-config qt6-base-dev
      - name: Unit tests
        env:
          AUDIO_TEST_BUILDER: local
        run: python3 -m unittest discover -s tests -v
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build current runtime and test image
        run: |
          docker build --pull --no-cache --target runtime -t wolf-jellyfin:local-review .
          bash tests/image-home.sh
          docker build --target test -t wolf-jellyfin:test .
      - name: Borderless fullscreen and recreation regression
        run: python3 tests/fullscreen.py
      - name: Native context-menu regression
        run: python3 tests/context_menu.py
      - name: Software native-client acceptance
        run: python3 tests/acceptance.py
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push tested runtime image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag wolf-jellyfin:local-review "$image:sha-$GITHUB_SHA"
          docker tag wolf-jellyfin:local-review "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
